<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
	<style>
/* Reset */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* Page */
body{
    font-family:Arial, sans-serif;
    background:white;
    color:black;
	}

/* Navigation */
.navbar{
    background:blue;
    padding:15px;
    text-align:center;
	}

.logo{
    color:white;
    font-size:24px;
    margin-bottom:10px;
	
}

.nav-links{
    list-style:none;
	
}

.nav-links li{
    display:inline;
    margin:10px;
}

.nav-links a{
    color:white;
    text-decoration:none;
}

.nav-links a:hover{
    color:yellow;
}

/* Sections */
section{
    padding:30px;
    text-align:center;
}

/* Headings */
h2{
    color:blue;
    margin-bottom:15px;
}

/* Hero Image */
.hero-image img{
    width:200px;
    border-radius:50%;
}

/* Buttons */
button{
    background:blue;
    color:white;
    border:none;
    padding:10px 20px;
    cursor:pointer;
}

button:hover{
    background:darkblue;
}

/* Footer */
footer{
    background:blue;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:100px;
}
</style>
</head>
<body>

<header>
    <nav class="navbar">
        <h2 class="logo">MyWebsite</h2>
<ul class="nav-links">
            <li><a href="home.html">Home</a></li>
			<li><a href="portfolio.html">Portfolio</a></li>
            <li><a href="contact me.html">Contact</a></li>
        </ul>
        
    </nav>
</header>

<section id="hero">

    <div class="hero-text">

        <h1>Welcome to My Website</h1>

        <h2>Learn Web Development</h2>

        <p>
            Build beautiful websites using HTML, CSS and JavaScript.
        </p>

        <button id="startBtn">Get Started</button>

		<button id="bgBtn">Click and Change the background Color</button>

    </div>

    <div class="hero-image">

        <img src="mypicture.jpg" alt="Hero Image">

    </div>

</section>

<script>

// Get Started button
document.getElementById("startBtn").onclick = function () {
    document.querySelector("h1").innerHTML = "Let's Learn Together!";
};
// Learn More button
document.getElementById("bgBtn").onclick = function () {
    document.body.style.backgroundColor = "lightblue";
    document.querySelector("h2").innerHTML = "Web Development is Fun!";
};
</script>

<footer>
    <p>&copy; My First Website</p>
</footer>
</body>
</html>
