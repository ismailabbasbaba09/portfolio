<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contactme</title>
	<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f4f4f4;
    color:#333;
}

.navbar{
    background:blue;
    padding:15px;
    text-align:center;
}

.logo{
    color:white;
    font-size:24px;
    margin-bottom:10px;
}

.nav-links{
    list-style:none;
}

.nav-links li{
    display:inline;
    margin:10px;
}

.nav-links a{
    color:white;
    text-decoration:none;
}

.nav-links a:hover{
    color:yellow;
}

section{
    padding:30px;
    text-align:center;
}

h2{
    color:blue;
    margin-bottom:15px;
}

button{
    background:blue;
    color:white;
    border:none;
    padding:10px 20px;
}

button:hover{
    background:darkblue;
}

form{
    width:300px;
    margin:auto;
}

input,
textarea{
    width:100%;
    padding:10px;
    margin:10px 0;
}

footer{
    background:blue;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:100px;
	}

</style>
</head>
<body>

<header>

    <nav class="navbar">
        <h2 class="logo">MyWebsite</h2>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
			<li><a href="portfolio.html">Portfolio</a></li>
            <li><a href="contact me.html">Contact</a></li>
        </ul>
    </nav>

</header>

<section id="contact">

    <h2>Contact Me</h2>

    <form id="contactForm">

    <input type="text" id="name" placeholder="Your Name">

    <input type="email" id="email" placeholder="Your Email" required="">

    <textarea id="message" placeholder="Your Message"></textarea>

    <button type="submit">Send</button>

</form>

</section>

<script>

// When the form is submitted
document.getElementById("contactForm").onsubmit = function(event){

   // Get the name
    let name = document.getElementById("name").value;

    // Check if the name is empty
    if(name == ""){
        alert("Please enter your name.");
    }
    else{
        alert("Thank you " + name + "! Your message has been sent.");
    }

};

</script>

<footer>

    <p>&copy; My First Website</p>

</footer>

<script src="script.js"></script>

</body>
</html>
